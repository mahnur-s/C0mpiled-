name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: android
        # Set the repository variable HARU_SERVER_URL (Settings > Secrets and variables > Actions > Variables)
        # to your deployed server, e.g. https://haru-pilot.fly.dev, so the app connects there by default.
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug -PharuServerUrl="${{ vars.HARU_SERVER_URL }}" --no-daemon 2>&1 | tee build.log
      - name: Show compiler errors
        if: failure()
        working-directory: android
        shell: bash
        # Kotlin/AAPT errors as annotations, readable on the run page without downloading logs.
        run: |
          [ -f build.log ] || { echo "No build log: the failure happened before the build started."; exit 0; }
          grep -E '^e: |error:|ERROR:|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: haru-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
