# Fly.io config. Change `app` to a unique name, then follow docs/SETUP.md.
app = "haru-pilot"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/haru.db"

[[mounts]]
  source = "haru_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The monitor loop runs inside the server, so exactly one machine must always be running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
